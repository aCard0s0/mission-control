server:
  port: ${MC_PORT:8080}
  compression:
    # gzip large JSON responses — notably session chat history, which can reach
    # several MB for long conversations
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024

# Profiling surface. Deliberately on its own port bound to loopback: the app port
# is what tailscale serve forwards to the tailnet (deploy/tailscale/serve.json) and
# what plain mode publishes, and these endpoints are not for either audience.
# `heapdump` in particular hands over the encryption key and every stored provider
# credential in cleartext. Reach them from inside the container instead:
#   docker exec mission-control-mission-control-1 \
#     wget -qO- http://127.0.0.1:8081/actuator/metrics/jvm.memory.used
management:
  server:
    port: ${MC_ACTUATOR_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump,heapdump
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: mission-control

spring:
  application:
    name: mission-control-server
  main:
    # the ASCII banner carries no information, and the two startup-info lines
    # (jar path, PID, "no active profile set") are restated by StartupSummary
    banner-mode: "off"
    log-startup-info: false
  datasource:
    url: jdbc:sqlite:${MC_DB_PATH:./data/mission-control.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite is a single-writer file database — one connection avoids lock contention
      maximum-pool-size: 1
  sql:
    init:
      mode: always

mc:
  startup-reconcile: ${MC_STARTUP_RECONCILE:true}
  api-base-url: ${MC_API_BASE_URL:}
  # Origins allowed to call this API. Spring rejects a request whose Origin is not
  # listed with 403 BEFORE the handler runs — and browsers attach Origin to every
  # request whose method is not GET or HEAD, same-origin ones included. So this
  # list must name the origin the app is actually SERVED from, not just the dev
  # servers. Omit it and plain GETs keep working while every mutation 403s, which
  # reads as "the dashboard went read-only" and points nowhere near CORS.
  # deploy/compose.yml builds this from TS_HOSTNAME + TS_TAILNET.
  cors-origins: ${MC_CORS_ORIGINS:http://localhost:4200,http://localhost:4300}
  docker-socket: ${MC_DOCKER_SOCKET:unix:///var/run/docker.sock}
  hermes-image: ${MC_HERMES_IMAGE:nousresearch/hermes-agent}
  container-filter: ${MC_CONTAINER_FILTER:hermes}
  # Look up published image tags on Docker Hub so the dashboard can report a
  # version that has not been pulled yet. Turn off for air-gapped installs —
  # tag listing then falls back to the local image store.
  registry-tags: ${MC_REGISTRY_TAGS:true}
  # Generated, non-secret Compose definitions for the managed MCP project.
  # The combined image overrides this to its persisted /data volume.
  mcp-stack-dir: ${MC_MCP_STACK_DIR:./data/mcp-stacks}
  version: 0.1.0
  # AES key material for encrypting profile-template secrets at rest. Required: the
  # app fails to start when unset unless allow-dev-key is true (local dev only).
  secret-key: ${MC_SECRET_KEY:}
  # The prior secret-key value during a rotation — decryption falls back to it, so
  # secrets stay readable until each is re-saved (re-encrypted) under the new key.
  secret-key-previous: ${MC_SECRET_KEY_PREVIOUS:}
  # Opt-in to a built-in dev key when secret-key is unset. Keep false in production:
  # the dev key is in the source, so anything encrypted with it is publicly readable.
  allow-dev-key: ${MC_ALLOW_DEV_KEY:false}
  # terminal (/ws/terminal docker exec) session limits — bound runaway/abandoned
  # shells so their JVM-side reader/writer threads cannot accumulate.
  #
  # No values here: the defaults are TerminalProperties' own, and stating them in both places
  # meant two files to change and one of them silently winning. These lines exist only to spell
  # the MC_TERMINAL_* names, because relaxed binding maps `max-sessions` to MC_TERMINAL_MAXSESSIONS
  # and would not see the underscored form anyone would actually type. An unset variable resolves
  # to empty, which binds as null, which is what the record defaults from.
  #
  # `user` needs no line: it has no dash, so the environment reaches it directly. The container
  # user the web shell runs as; MC_TERMINAL_USER= (empty) keeps the image default.
  terminal:
    max-sessions: ${MC_TERMINAL_MAX_SESSIONS:}
    max-sessions-per-client: ${MC_TERMINAL_MAX_SESSIONS_PER_CLIENT:}
    idle-timeout: ${MC_TERMINAL_IDLE_TIMEOUT:}
    session-max-lifetime: ${MC_TERMINAL_SESSION_MAX_LIFETIME:}
    heartbeat-interval: ${MC_TERMINAL_HEARTBEAT_INTERVAL:}
    pong-timeout: ${MC_TERMINAL_PONG_TIMEOUT:}
  # curated model catalog fallbacks, used when no live provider fetch is possible
  # Twice-daily re-read of the providers whose model list needs no credential
  # (OpenRouter, NVIDIA NIM, Nous). Off in tests, which must not reach the internet.
  model-catalog:
    refresh: ${MC_MODEL_CATALOG_REFRESH:true}
  models:
    # Seeds and fallbacks. Once a provider has been read — by the background refresh,
    # which also uses a saved credential for Anthropic and OpenAI when one exists, or by
    # an operator typing a key into the picker — its stored list is what the picker
    # offers, and these are only what it starts from.
    #
    # Written here rather than behind MC_MODELS_* placeholders: a seed list the refresh
    # replaces on first contact is not something anyone deploys an override for, and five
    # env vars nothing sets read as five knobs someone has to understand.
    #
    # Nous Portal is an OAuth account (hermes portal) for inference, but its model
    # LIST is served without a key, so this list is superseded once refreshed.
    nous: Hermes-4-405B,Hermes-4-70B,Hermes-4-14B
    anthropic: claude-fable-5,claude-opus-4-8,claude-sonnet-4-6,claude-haiku-4-5-20251001
    openai: gpt-5.2,gpt-5.2-mini,gpt-5.1,gpt-4.1
    # OpenRouter ids are provider/model — the live list (openrouter.ai/api/v1/models)
    # supersedes this when reachable.
    openrouter: nousresearch/hermes-4-405b,anthropic/claude-opus-4.7,anthropic/claude-sonnet-4,openai/gpt-5.2,google/gemini-2.5-pro,deepseek/deepseek-chat
    # Instruct-tuned entries taken from NVIDIA's own /v1/models, so the picker has
    # something usable in the window before the first refresh lands.
    nvidia: meta/llama-3.3-70b-instruct,nvidia/llama-3.3-nemotron-super-49b-v1.5,nvidia/llama-3.1-nemotron-70b-instruct,nvidia/llama-3.1-nemotron-ultra-253b-v1,mistralai/mistral-nemotron

logging:
  # One process per container, one application per process: the PID, the application
  # name and the `---` separator repeat on every line without ever distinguishing two
  # lines from each other. The simple class name is what an operator scans for, so the
  # 40-character fully-qualified logger is traded for it.
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5p) %clr(%-25.25logger{0}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: INFO
    # the one knob worth exposing: MC_LOG_LEVEL=DEBUG turns on this application's
    # per-operation detail without also turning on the libraries' own
    io.hermes.missioncontrol: ${MC_LOG_LEVEL:INFO}
    # Third-party boot chatter. Everything it reports that an operator needs —
    # the port, the database, the daemon — is in the StartupSummary block instead,
    # and these otherwise bury it under a dozen lines about servlet contexts.
    com.github.dockerjava: WARN
    org.apache.hc: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
    com.zaxxer.hikari: WARN
    org.springframework.boot.web.embedded.tomcat: WARN
    org.springframework.boot.web.servlet.context: WARN
    org.springframework.boot.autoconfigure.web: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
